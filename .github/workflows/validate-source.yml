name: Validate Launcher Source

on:
  push:
    branches:
      - launcher-self-updater
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build launcher source
        run: dotnet build "HSHONAD Launcher.csproj" --configuration Release
      - name: Build update API source
        run: dotnet build "HSHONAD.UpdateApi/HSHONAD.UpdateApi.csproj" --configuration Release
