name: Build HSHONAD Launcher

on:
  push:
    branches:
      - feature/select-game-fix
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ".\HSHONAD Launcher.csproj"

      - name: Build Release
        run: dotnet build ".\HSHONAD Launcher.csproj" --configuration Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Hosts Registry Web
        shell: pwsh
        run: |
          node --check hosts-control-web/server.js
          node --check hosts-control-web/lib/hosts.js
          node --test hosts-control-web/test/hosts.test.js

      - name: Package source ZIP
        shell: pwsh
        run: git archive --format=zip --output="HSHONAD-Launcher-source.zip" HEAD

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HSHONAD-Launcher-source
          path: HSHONAD-Launcher-source.zip
          if-no-files-found: error
          retention-days: 14
