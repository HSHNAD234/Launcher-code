name: Build HSHONAD Launcher

on:
  push:
    branches:
      - feature/select-game-fix
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ".\HSHONAD Launcher.csproj"

      - name: Build Release
        run: dotnet build ".\HSHONAD Launcher.csproj" --configuration Release --no-restore
