name: Build HSHONAD Launcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ".\\HSHONAD Launcher.csproj"

      - name: Publish Windows x64
        run: dotnet publish ".\\HSHONAD Launcher.csproj" --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output ".\\publish"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: HSHONAD-Launcher-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 14
