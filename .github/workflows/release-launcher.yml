name: Release HSHONAD Launcher

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart([char[]]@('v', 'V'))
          if (-not $version) { throw "Tag must contain a version, e.g. v1.0.1" }
          $html = Get-Content "wwwroot/index.html" -Raw
          $html = $html.Replace("__LAUNCHER_VERSION__", $version)
          Set-Content "wwwroot/index.html" -Value $html -NoNewline -Encoding utf8
          dotnet publish "HSHONAD Launcher.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            "-p:Version=$version" `
            -p:PublishSingleFile=false `
            --output publish

      - name: Package release payload
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/*" -DestinationPath "HSHONAD-Launcher-win-x64.zip" -CompressionLevel Optimal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: HSHONAD-Launcher-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
