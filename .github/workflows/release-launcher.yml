name: Release HSHONAD Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish "HSHONAD Launcher.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=${{ github.ref_name }} `
            -p:PublishSingleFile=false `
            --output publish

      - name: Package release payload
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/*" -DestinationPath "HSHONAD-Launcher-win-x64.zip" -CompressionLevel Optimal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: HSHONAD-Launcher-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
