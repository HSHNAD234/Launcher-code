services:
  - type: web
    name: hshonad-host-registry
    runtime: node
    plan: free
    rootDir: hosts-control-web
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "false"
      - key: ADMIN_TOKEN
        generateValue: true
